<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bulby</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand"><img src="icons/bulby-48.png" width="32" height="32" alt=""><h1>Bulby</h1></div>
    <a href="bulby://open" id="launch" class="button secondary">Open Bulby</a>
  </header>
  <main>
    <h2>Connect to ChatGPT</h2>
    <label for="token">Pairing code</label>
    <input id="token" type="password" placeholder="Paste pairing code" autocomplete="off" spellcheck="false">
    <button id="pair" class="button primary">Connect</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>

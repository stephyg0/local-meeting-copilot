<!doctype html><html lang="en"><meta charset="utf-8"><title>Bulby</title>
<style>body{font:14px system-ui;width:260px;padding:12px;background:#172022;color:#fff}input,button{box-sizing:border-box;width:100%;padding:9px;margin:6px 0}button{background:#78e0b1;color:#081713;border:0;border-radius:6px;cursor:pointer;font-weight:600}button:active{transform:translateY(1px);background:#55c99a}button:disabled{cursor:wait;opacity:.7}p{line-height:1.4}#status[data-state="success"]{color:#78e0b1}#status[data-state="error"]{color:#ffaaa5}</style>
<strong>Connect this ChatGPT tab</strong>
<p><a href="bulby://open" id="launch" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:9px;border-radius:6px;background:#78e0b1;color:#081713;text-decoration:none;font-weight:600"><img src="icons/bulby-32.png" width="24" height="24" alt="">Open Bulby</a></p>
<p>Copy the pairing code from Bulby and paste it here. Ask sends your transcript and screenshot to this tab.</p>
<input id="token" type="password" aria-label="Pairing code" placeholder="Pairing code"><button id="pair">Connect</button><p id="status" role="status"></p>
<script src="popup.js"></script></html>
